# 예시일 뿐입니다. 실제로는 파일로 커밋하지 말고 아래 명령으로 만드세요:
#   kubectl -n ax-pilot create secret generic agent-secret \
#     --from-literal=LLM_API_KEY='sk-...' \
#     --from-literal=DB_DSN='postgresql://ro_agent:...@db-svr.corp.local:5432/appdb'
apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: ax-pilot
type: Opaque
stringData:
  LLM_API_KEY: "sk-dummy-for-lab"
  DB_DSN: "postgresql://appuser:apppass@postgres:5432/appdb"
