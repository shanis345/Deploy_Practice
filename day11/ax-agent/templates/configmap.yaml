apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ax-agent.name" . }}-config
  labels: {{- include "ax-agent.labels" . | nindent 4 }}
data:
  prompt.txt: {{ .Values.config.prompt | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
