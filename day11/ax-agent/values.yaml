# 기본값. 환경별 차이는 values-<env>.yaml 로 덮어쓴다.
replicaCount: 2
image:
  repository: onprem-registry:5000/ax/agent
  tag: "0.2.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []            # 고객사 Harbor: [{ name: harbor-cred }]
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: "1",  memory: 512Mi }
config:
  logLevel: INFO
  llmModel: gpt-4o-mini
  prompt: |
    당신은 사내 업무 지원 에이전트입니다.
    근거가 없는 내용은 추측하지 말고 모른다고 답하십시오.
secretName: agent-secret        # 차트 밖에서 kubectl create secret 으로 미리 만든다
ingress:
  enabled: true
  className: traefik
  host: agent.local
  annotations: {}
