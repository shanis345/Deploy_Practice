apiVersion: apps/v1
kind: Deployment
metadata: { name: b-crashloop, namespace: ax-pilot }
spec:
  replicas: 1
  selector: { matchLabels: { app: b-crashloop } }
  template:
    metadata: { labels: { app: b-crashloop } }
    spec:
      containers:
        - name: agent
          image: onprem-registry:5000/ax/agent:0.2.0
          command: ["python", "-c", "import sys; print('설정 파일 없음: /app/config/required.yaml'); sys.exit(1)"]
