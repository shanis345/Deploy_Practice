http_port 3128

# 허용할 목적지 도메인 (앞의 점은 서브도메인 포함)
acl allowed_sites dstdomain .example.com
acl allowed_sites dstdomain .openai.com .anthropic.com .azure.com

# CONNECT(HTTPS 터널)는 443만 허용
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# 화이트리스트만 허용, 나머지 전부 차단
http_access allow allowed_sites
http_access deny all

# 로그: 어디로 나갔는지 전부 기록된다 (docker compose exec proxy tail -f /var/log/squid/access.log)
access_log daemon:/var/log/squid/access.log squid
cache deny all
