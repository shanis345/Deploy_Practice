server {
    listen 80;
    client_max_body_size 20m;

    location / {
        proxy_pass http://agent:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;     # 요청 ID 전파 (관측성)
        # 에이전트는 응답이 길다
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE 스트리밍을 위해 버퍼링 해제
        proxy_buffering off;
        proxy_cache off;
    }
    # 실습용 엔드포인트는 외부에 노출하지 않는다
    location /_lab/ { return 403; }
}
